name: sting
description: "A new bare-metal game engine project for Dart."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^4.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.1

flutter:
  assets:
    - showcase/assets/player.png
    - showcase/assets/enemy.png
    - showcase/assets/projectile.png
    - showcase/assets/tilemap.png
  shaders:
    - test/assets/test_shader.frag
